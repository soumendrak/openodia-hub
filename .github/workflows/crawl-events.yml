name: Crawl Odia AI Events

on:
  schedule:
    - cron: "0 6 * * *" # daily at 6:00 UTC (11:30 IST)
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Crawl events
        id: crawl
        run: |
          set -o pipefail
          set +e
          bun run scripts/crawl-events.mjs 2>&1 | tee /tmp/crawl-output.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "has_changes=$(grep -c 'NEW_EVENTS_FOUND' /tmp/crawl-output.txt || true)" >> $GITHUB_OUTPUT
          exit $status
      - name: Format crawled event data
        if: (success() || failure()) && steps.crawl.outputs.has_changes != '0'
        run: bunx prettier --write src/data/events
      - name: Date for the PR title
        id: date
        if: (success() || failure()) && steps.crawl.outputs.has_changes != '0'
        run: echo "today=$(date +'%b %d')" >> "$GITHUB_OUTPUT"
      - name: Create PR if event data changed
        if: (success() || failure()) && steps.crawl.outputs.has_changes != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "auto: crawl new Odia AI events"
          title: "Odia AI event data updated — ${{ steps.date.outputs.today }}"
          body: |
            Automated crawl found new events or refreshed redirected event destinations.

            Review and merge if the events look correct.
            Source list: https://github.com/soumendrak/openodia-hub/blob/main/.agents/skills/crawl-events/references/sources.md
          branch: auto/crawl-events
          delete-branch: true
